<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 paulovektor • 5x Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: #0e0b16;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Efeito de fundo sutil */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #2a1b3d 0%, #0b0812 90%);
            z-index: -1;
        }

        .header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(26, 18, 38, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #772ce8;
            border-radius: 60px;
            padding: 8px 24px 8px 16px;
            box-shadow: 0 8px 20px rgba(119, 44, 232, 0.2);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(145deg, #9147ff, #4b2a8a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
        }

        .channel-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
        }

        .channel-name span {
            color: #a970ff;
            font-weight: 400;
            font-size: 1rem;
            margin-left: 8px;
        }

        .live-badge {
            background: #eb0400;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px #ff4d4d;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.9; box-shadow: 0 0 10px #ff4d4d; }
            50% { opacity: 1; box-shadow: 0 0 20px #ff4d4d; }
            100% { opacity: 0.9; box-shadow: 0 0 10px #ff4d4d; }
        }

        .status-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #9147ff40;
            border-radius: 40px;
            padding: 8px 24px;
            color: #c5b0ff;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #3eff9e;
            border-radius: 50%;
            box-shadow: 0 0 12px #3eff9e;
        }

        /* Grid principal: 2 colunas no desktop, 1 no mobile */
        .grid {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 0 auto;
        }

        /* Card do player */
        .player-card {
            background: #1f1730;
            border-radius: 28px;
            overflow: hidden;
            border: 2px solid #382e4a;
            transition: all 0.3s ease;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.8);
        }

        .player-card:hover {
            border-color: #9147ff;
            transform: translateY(-5px);
            box-shadow: 0 25px 40px -8px #772ce880;
        }

        /* Header do player com IP simulado */
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #140e1f;
            border-bottom: 1px solid #2e2342;
        }

        .player-id {
            background: #2e1e45;
            color: #bf9eff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .fake-ip {
            font-family: 'Courier New', monospace;
            background: #1b1329;
            padding: 4px 14px;
            border-radius: 30px;
            color: #a970ff;
            font-size: 0.75rem;
            border: 1px dashed #4a3a62;
        }

        .twitch-container {
            background: #0c0814;
            aspect-ratio: 16 / 9;
            width: 100%;
        }

        .twitch-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Rodapé do player */
        .player-footer {
            padding: 12px 18px;
            background: #1a1326;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #b7a0e0;
            font-size: 0.85rem;
            border-top: 1px solid #2e2342;
        }

        .region {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .flag {
            font-size: 1.2rem;
        }

        .ping {
            background: #271f36;
            padding: 3px 10px;
            border-radius: 30px;
            color: #b3f0ff;
        }

        /* Rodapé global */
        .global-footer {
            margin-top: 40px;
            text-align: center;
            color: #5e4e7a;
            font-size: 0.9rem;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: start;
            }
        }

        /* Animação sutil para IPs */
        @keyframes ipFlicker {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        .fake-ip {
            animation: ipFlicker 4s infinite;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="channel-info">
        <div class="avatar">P</div>
        <div class="channel-name">
            paulovektor <span>• Ao vivo?</span>
        </div>
    </div>
    <div class="status-box">
        <span class="dot"></span>
        <span>5 players • reprodução contínua</span>
    </div>
    <div class="live-badge">
        <span>🔴</span> MULTI-VIEW
    </div>
</div>

<!-- Grid com 5 players -->
<div class="grid" id="playerGrid"></div>

<div class="global-footer">
    ⚡ Stream exclusiva: twitch.tv/paulovektor • 5 visualizações simultâneas • IPs simulados
</div>

<script>
    (function() {
        const CHANNEL = 'paulovektor';
        const PLAYER_COUNT = 5;

        // Lista de países e faixas de IP para simular diversidade
        const LOCATIONS = [
            { flag: '🇧🇷', country: 'Brasil', ipBase: '177.45.23.', ping: '34ms' },
            { flag: '🇵🇹', country: 'Portugal', ipBase: '85.241.78.', ping: '98ms' },
            { flag: '🇺🇸', country: 'Estados Unidos', ipBase: '67.205.156.', ping: '145ms' },
            { flag: '🇯🇵', country: 'Japão', ipBase: '126.13.45.', ping: '267ms' },
            { flag: '🇩🇪', country: 'Alemanha', ipBase: '85.214.78.', ping: '132ms' },
            { flag: '🇫🇷', country: 'França', ipBase: '82.127.34.', ping: '118ms' },
            { flag: '🇨🇦', country: 'Canadá', ipBase: '64.45.67.', ping: '156ms' },
            { flag: '🇬🇧', country: 'Reino Unido', ipBase: '89.105.213.', ping: '109ms' }
        ];

        // Função para gerar IP aleatório baseado em localização
        function generateRandomIp(location) {
            const lastOctet = Math.floor(Math.random() * 254) + 1; // 1-254
            return location.ipBase + lastOctet;
        }

        // Função principal para criar os players
        function createPlayers() {
            const grid = document.getElementById('playerGrid');
            grid.innerHTML = ''; // Limpa antes de adicionar

            for (let i = 0; i < PLAYER_COUNT; i++) {
                // Seleciona uma localização aleatória para este player
                const randomIndex = Math.floor(Math.random() * LOCATIONS.length);
                const loc = LOCATIONS[randomIndex];
                const fakeIP = generateRandomIp(loc);

                // Gera um ID de sessão único para evitar cache do navegador (opcional)
                const uniqueId = Date.now() + i + Math.random();

                // Constrói a URL de embed da Twitch
                // Parent = domínio onde o site está rodando. Se for local, usar localhost.
                // Caso esteja num domínio personalizado, trocar para ele.
                const parentDomain = window.location.hostname || 'localhost';
                const twitchUrl = `https://player.twitch.tv/?channel=${CHANNEL}&parent=${parentDomain}&muted=false&autoplay=true&controls=true&time=${uniqueId}`;

                // Cria o card do player
                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="player-header">
                        <span class="player-id">PLAYER #${i + 1}</span>
                        <span class="fake-ip">🌐 ${fakeIP}</span>
                    </div>
                    <div class="twitch-container">
                        <iframe src="${twitchUrl}" 
                                allow="autoplay; fullscreen; encrypted-media" 
                                allowfullscreen="false"
                                loading="eager"
                                title="paulovektor live ${i + 1}">
                        </iframe>
                    </div>
                    <div class="player-footer">
                        <span class="region">
                            <span class="flag">${loc.flag}</span> ${loc.country}
                        </span>
                        <span class="ping">📶 ${loc.ping}</span>
                    </div>
                `;

                grid.appendChild(card);
            }
        }

        // Inicializa tudo após o carregamento da página
        window.addEventListener('load', () => {
            createPlayers();
            console.log(`✅ ${PLAYER_COUNT} players do canal ${CHANNEL} criados.`);
        });

        // (Opcional) Pequeno ajuste para tentar garantir o autoplay 
        // Simula um clique inicial na página, o que ajuda no autoplay em alguns navegadores.
        setTimeout(() => {
            document.body.click(); 
        }, 500);
    })();
</script>

</body>
</html>
