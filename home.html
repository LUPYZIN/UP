<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤫 MODO STEALTH • 5× paulovektor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c0f;
            min-height: 100vh;
            padding: 10px;
            font-family: 'Segoe UI', system-ui;
        }

        /* TÍTULO ZUEIRA */
        .top-secret {
            background: #1a1a2e;
            border: 3px solid #ff79c6;
            border-radius: 50px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px #ff79c6;
        }

        .top-secret h1 {
            color: #fff;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: coresLoucas 3s infinite;
        }

        @keyframes coresLoucas {
            0% { text-shadow: 0 0 30px red; }
            25% { text-shadow: 0 0 30px blue; }
            50% { text-shadow: 0 0 30px green; }
            75% { text-shadow: 0 0 30px yellow; }
            100% { text-shadow: 0 0 30px purple; }
        }

        .top-secret p {
            color: #8be9fd;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .warning {
            background: #ff5555;
            color: black;
            font-weight: bold;
            padding: 10px;
            border-radius: 30px;
            display: inline-block;
            animation: piscaPisca 0.5s infinite;
        }

        @keyframes piscaPisca {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* GRID DOS PLAYERS - AGORA COM 5 */
        .grid-stealth {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px 0;
            position: relative;
        }

        /* CARD DO PLAYER - TODO DISFARÇADO */
        .player-card {
            background: #16213e;
            border: 2px solid #00fff9;
            border-radius: 15px;
            padding: 8px;
            transition: all 0.3s;
            position: relative;
            box-shadow: 0 0 25px #00fff9;
        }

        .player-card:hover {
            transform: scale(1.02);
            border-color: #ff00c8;
            box-shadow: 0 0 35px #ff00c8;
        }

        /* HEADER SUPER FAKE */
        .header-fake {
            background: #0f3460;
            padding: 8px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #e94560;
            margin-bottom: 8px;
        }

        .player-nome {
            background: #e94560;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .ip-fake {
            background: #0a1a2f;
            color: #00fff9;
            padding: 4px 12px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            border: 1px solid #00fff9;
        }

        /* CONTAINER DO VIDEO */
        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #e94560;
            background: #000;
        }

        .video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* OVERLAY DISFARÇE */
        .overlay-disfarce {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.5rem;
            font-family: monospace;
            border: 1px solid #0f0;
            pointer-events: none;
            z-index: 10;
        }

        /* FOOTER DO PLAYER */
        .footer-fake {
            margin-top: 8px;
            padding: 8px;
            background: #0f3460;
            border-radius: 0 0 10px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            border-top: 2px dashed #e94560;
        }

        .pais-fake {
            color: #00fff9;
            font-weight: bold;
        }

        .ping-fake {
            color: #8be9fd;
            background: #1a1a2e;
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* BOTÕES ZUEIRA */
        .botões-loucura {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .btn-loko {
            background: linear-gradient(45deg, #ff006e, #ffbe0b);
            border: none;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 0 30px #ff006e;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-loko:hover {
            transform: rotate(5deg) scale(1.1);
            box-shadow: 0 0 50px #ffbe0b;
        }

        .btn-loko:active {
            transform: rotate(-5deg) scale(0.9);
        }

        /* STATS ZUEIRA */
        .stats-zueira {
            background: #1a1a2e;
            border: 3px solid #00fff9;
            border-radius: 30px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            color: white;
            font-weight: bold;
            margin: 20px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-valor {
            font-size: 2rem;
            color: #00fff9;
            font-family: 'Courier New', monospace;
        }

        /* EFEITO MATRIX LOKO */
        .matrix-efeito {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,255,0,0.03) 0px,
                transparent 2px,
                rgba(255,0,255,0.03) 3px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 1200px) {
            .grid-stealth {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 800px) {
            .grid-stealth {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .grid-stealth {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="matrix-efeito"></div>

<div class="top-secret">
    <h1>🤫 OPERAÇÃO: PAULOVEKTOR SECRETO</h1>
    <p><span class="warning">⚠️ MODO NINJA ATIVADO ⚠️</span></p>
    <p style="color: #f1fa8c;">5 players • Cada um com IP diferente • Twitch nem percebe</p>
</div>

<div class="stats-zueira">
    <div class="stat-item">
        <div class="stat-valor" id="statViewers">69</div>
        <div>VIEWERS</div>
    </div>
    <div class="stat-item">
        <div class="stat-valor" id="statIps">5</div>
        <div>IPS DIFERENTES</div>
    </div>
    <div class="stat-item">
        <div class="stat-valor" id="statPaises">5</div>
        <div>PAÍSES</div>
    </div>
</div>

<!-- GRID DOS 5 PLAYERS -->
<div class="grid-stealth" id="gridNinja"></div>

<div class="botões-loucura">
    <button class="btn-loko" id="btnAtivar">🎮 ATIVAR MODO NINJA</button>
    <button class="btn-loko" id="btnTrocarIP">🔄 TROCAR IPS</button>
    <button class="btn-loko" id="btnReset">✨ RECARREGAR TUDO</button>
</div>

<script>
    (function() {
        const CANAL = 'paulovektor';
        const QUANTIDADE = 5;
        
        // BASE DE DADOS ZUEIRA (países e IPs)
        const DB_LOKO = [
            { pais: '🇧🇷 BRASIL', ipBase: '177.45.23.', ping: '21ms', cidade: 'São Paulo' },
            { pais: '🇺🇸 EUA', ipBase: '67.205.156.', ping: '145ms', cidade: 'New York' },
            { pais: '🇯🇵 JAPÃO', ipBase: '126.13.45.', ping: '267ms', cidade: 'Tokyo' },
            { pais: '🇩🇪 ALEMANHA', ipBase: '85.214.78.', ping: '132ms', cidade: 'Berlin' },
            { pais: '🇫🇷 FRANÇA', ipBase: '82.127.34.', ping: '118ms', cidade: 'Paris' },
            { pais: '🇬🇧 UK', ipBase: '89.105.213.', ping: '109ms', cidade: 'London' },
            { pais: '🇨🇦 CANADÁ', ipBase: '64.45.67.', ping: '156ms', cidade: 'Toronto' },
            { pais: '🇦🇺 AUSTRÁLIA', ipBase: '103.87.45.', ping: '289ms', cidade: 'Sydney' },
            { pais: '🇮🇳 ÍNDIA', ipBase: '103.45.67.', ping: '198ms', cidade: 'Mumbai' },
            { pais: '🇰🇷 COREIA', ipBase: '112.45.67.', ping: '178ms', cidade: 'Seoul' }
        ];

        // FUNÇÃO PARA GERAR IP ALEATÓRIO
        function gerarIp(base) {
            return base + Math.floor(Math.random() * 255);
        }

        // FUNÇÃO PARA CRIAR OS PLAYERS
        function criarPlayers() {
            const grid = document.getElementById('gridNinja');
            grid.innerHTML = '';
            
            for (let i = 0; i < QUANTIDADE; i++) {
                const data = DB_LOKO[Math.floor(Math.random() * DB_LOKO.length)];
                const ipCompleto = gerarIp(data.ipBase);
                const parentDomain = window.location.hostname || 'localhost';
                
                // URL DA TWITCH COM PARÂMETROS DIFERENTES
                const twitchUrl = `https://player.twitch.tv/?channel=${CANAL}&parent=${parentDomain}&muted=false&autoplay=true&controls=false&_=${Date.now()}_${i}_${Math.random()}`;

                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="header-fake">
                        <span class="player-nome">🎮 PLAYER #${i+1}</span>
                        <span class="ip-fake">🌐 ${ipCompleto}</span>
                    </div>
                    <div class="video-box">
                        <iframe src="${twitchUrl}" 
                                allow="autoplay; encrypted-media"
                                allowfullscreen="false"
                                loading="eager"></iframe>
                        <div class="overlay-disfarce">📡 ${data.cidade}</div>
                    </div>
                    <div class="footer-fake">
                        <span class="pais-fake">${data.pais}</span>
                        <span class="ping-fake">📶 ${data.ping}</span>
                    </div>
                `;
                
                grid.appendChild(card);
            }
            
            // Atualiza stats zueira
            document.getElementById('statIps').textContent = QUANTIDADE;
            document.getElementById('statPaises').textContent = QUANTIDADE;
            document.getElementById('statViewers').textContent = Math.floor(Math.random() * 100) + 50;
        }

        // FUNÇÃO PARA TROCAR IPS (SEM RECARREGAR VÍDEO)
        function trocarIPs() {
            const cards = document.querySelectorAll('.player-card');
            
            cards.forEach((card, index) => {
                const data = DB_LOKO[Math.floor(Math.random() * DB_LOKO.length)];
                const ipCompleto = gerarIp(data.ipBase);
                
                // Troca IP no header
                const ipSpan = card.querySelector('.ip-fake');
                ipSpan.textContent = `🌐 ${ipCompleto}`;
                
                // Troca país no footer
                const paisSpan = card.querySelector('.pais-fake');
                paisSpan.textContent = data.pais;
                
                // Troca ping
                const pingSpan = card.querySelector('.ping-fake');
                pingSpan.textContent = `📶 ${data.ping}`;
                
                // Troca cidade no overlay
                const overlay = card.querySelector('.overlay-disfarce');
                overlay.textContent = `📡 ${data.cidade}`;
            });
            
            // Muda o contador de viewers
            document.getElementById('statViewers').textContent = Math.floor(Math.random() * 100) + 50;
        }

        // RECARREGAR TUDO
        function recarregarTudo() {
            criarPlayers();
        }

        // BOTÕES
        document.getElementById('btnAtivar').addEventListener('click', () => {
            alert('🚀 MODO NINJA ATIVADO! Twitch: "O que aconteceu com meus viewers?"');
            criarPlayers();
        });

        document.getElementById('btnTrocarIP').addEventListener('click', trocarIPs);
        
        document.getElementById('btnReset').addEventListener('click', recarregarTudo);

        // INICIALIZAÇÃO
        window.addEventListener('load', () => {
            criarPlayers();
            
            // AUTO CLICK PARA AJUDAR AUTOPLAY
            setTimeout(() => {
                document.body.click();
            }, 1000);
        });

        // FICA TROCANDO O TÍTULO DA PÁGINA (ZUEIRA)
        const titulos = [
            "🤫 PSIU... ASSISTINDO",
            "🎮 5× paulovektor",
            "🔄 TROCA IP RÁPIDO",
            "🔴 LIVE SECRETA",
            "🌀 MODO HACK ATIVADO"
        ];
        
        setInterval(() => {
            document.title = titulos[Math.floor(Math.random() * titulos.length)];
        }, 3000);
    })();
</script>

<!-- RODAPÉ ZUEIRA -->
<div style="text-align: center; margin-top: 20px; color: #6272a4; font-size: 0.8rem;">
    🔥 5 players • IPs diferentes • Twitch acha que são 5 pessoas diferentes • Confia 🔥
</div>

</body>
</html>
