<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 5× paulovektor • LOGIN REAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #0e0b16;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* CABEÇALHO */
        .header {
            background: linear-gradient(145deg, #4b2a8a, #1e0f3a);
            border: 2px solid #772ce8;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 25px;
            color: white;
            box-shadow: 0 0 30px #772ce8;
        }

        .header h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 10px 25px;
            border: 1px solid #9147ff;
        }

        .stat span {
            font-size: 1.5rem;
            font-weight: bold;
            color: #9147ff;
        }

        /* GRID DOS PLAYERS */
        .grid-players {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        /* CARD DO PLAYER */
        .player-card {
            background: #1a1429;
            border: 2px solid #9147ff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }

        .player-card:hover {
            transform: translateY(-5px);
            border-color: #b87cff;
            box-shadow: 0 0 35px #9147ff;
        }

        /* HEADER DO PLAYER (com botão de login) */
        .player-header {
            background: #221c33;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #9147ff;
        }

        .player-title {
            background: #9147ff;
            color: white;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .login-status {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 20px;
            background: #ffd966;
            color: #000;
            font-weight: bold;
        }

        .login-status.logged {
            background: #4caf50;
            color: white;
        }

        /* CONTAINER DO VIDEO */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* OVERLAY DE LOGIN */
        .login-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 20;
            backdrop-filter: blur(3px);
        }

        .login-overlay button {
            background: #9147ff;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            border: 2px solid white;
        }

        .login-overlay button:hover {
            background: #772ce8;
            transform: scale(1.05);
        }

        .login-overlay small {
            color: #ccc;
            font-size: 0.7rem;
        }

        /* RODAPÉ DO PLAYER */
        .player-footer {
            padding: 8px 10px;
            background: #1a1429;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            border-top: 1px solid #9147ff;
        }

        .account-info {
            color: #b87cff;
            font-family: monospace;
        }

        /* BOTÕES GLOBAIS */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(45deg, #9147ff, #b87cff);
            border: none;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 0 25px #9147ff;
            transition: all 0.3s;
        }

        .btn.secondary {
            background: linear-gradient(45deg, #4a4a4a, #2a2a2a);
            box-shadow: 0 0 25px #666;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px #b87cff;
        }

        /* MODAL DE LOGIN */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #221c33;
            border: 3px solid #9147ff;
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 60px #9147ff;
        }

        .modal-content h2 {
            color: white;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 30px;
            border: none;
            background: #332b45;
            color: white;
            font-size: 1rem;
        }

        .modal-content button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 30px;
            border: none;
            background: #9147ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-close {
            text-align: center;
            color: #ccc;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 1200px) {
            .grid-players {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 800px) {
            .grid-players {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎮 5× PAULOVEKTOR • LOGIN REAL</h1>
        <div class="stats">
            <div class="stat"><span id="loggedCount">0</span>/5 logados</div>
            <div class="stat"><span id="viewerCount">0</span> viewers simulados</div>
            <div class="stat"><span id="ipCount">5</span> IPs diferentes</div>
        </div>
    </div>

    <!-- GRID DOS 5 PLAYERS -->
    <div class="grid-players" id="playerGrid"></div>

    <!-- BOTÕES -->
    <div class="action-buttons">
        <button class="btn" id="loginAllBtn">🔐 FAZER LOGIN EM TODOS</button>
        <button class="btn secondary" id="resetBtn">🔄 RECARREGAR PLAYERS</button>
    </div>
</div>

<!-- MODAL DE LOGIN -->
<div class="modal" id="loginModal">
    <div class="modal-content">
        <h2 id="modalTitle">Login Player #1</h2>
        <input type="text" id="loginUser" placeholder="Usuário Twitch">
        <input type="password" id="loginPass" placeholder="Senha">
        <button id="confirmLogin">ENTRAR</button>
        <div class="modal-close" id="closeModal">✕ fechar</div>
    </div>
</div>

<script>
    (function() {
        const CHANNEL = 'paulovektor';
        const PLAYER_COUNT = 5;
        
        // Controle dos players
        let players = [];
        let currentPlayerIndex = 0;
        let loggedCount = 0;
        
        // Dados dos IPs por player
        const IP_DATA = [
            { ip: '177.45.23.187', pais: '🇧🇷 Brasil', ping: '34ms' },
            { ip: '67.205.156.92', pais: '🇺🇸 EUA', ping: '145ms' },
            { ip: '89.105.213.156', pais: '🇬🇧 UK', ping: '109ms' },
            { ip: '85.214.78.43', pais: '🇩🇪 Alemanha', ping: '132ms' },
            { ip: '126.13.45.201', pais: '🇯🇵 Japão', ping: '267ms' }
        ];

        // CONTA DEMO (para teste - NÃO FUNCIONA DE VERDADE)
        // Isso é só uma simulação visual! Você precisa usar contas reais.
        const CONTAS_DEMO = [
            { user: 'gamer_br_01', pass: '******' },
            { user: 'stream_lover_22', pass: '******' },
            { user: 'twitch_fan_89', pass: '******' },
            { user: 'viewer_anon_44', pass: '******' },
            { user: 'lurker_br_77', pass: '******' }
        ];

        function createPlayer(index) {
            const ipInfo = IP_DATA[index];
            const parentDomain = window.location.hostname || 'localhost';
            
            // URL da Twitch com parâmetros
            const twitchUrl = `https://player.twitch.tv/?channel=${CHANNEL}&parent=${parentDomain}&muted=false&autoplay=true&controls=true&t=${Date.now()}_${index}`;

            const card = document.createElement('div');
            card.className = 'player-card';
            card.dataset.index = index;
            card.dataset.logged = 'false';
            
            card.innerHTML = `
                <div class="player-header">
                    <span class="player-title">PLAYER #${index+1}</span>
                    <span class="login-status" id="status-${index}">🔓 não logado</span>
                </div>
                <div class="video-wrapper" id="wrapper-${index}">
                    <iframe src="${twitchUrl}" 
                            allow="autoplay; encrypted-media; fullscreen"
                            allowfullscreen="false"
                            id="iframe-${index}"></iframe>
                    <div class="login-overlay" id="overlay-${index}">
                        <button onclick="window.loginPlayer(${index})">🔐 FAZER LOGIN</button>
                        <small>Use conta Twitch real</small>
                    </div>
                </div>
                <div class="player-footer">
                    <span>${ipInfo.pais}</span>
                    <span class="account-info" id="account-${index}">🌐 ${ipInfo.ip}</span>
                    <span>📶 ${ipInfo.ping}</span>
                </div>
            `;
            
            return card;
        }

        function initializeGrid() {
            const grid = document.getElementById('playerGrid');
            grid.innerHTML = '';
            players = [];
            loggedCount = 0;
            
            for (let i = 0; i < PLAYER_COUNT; i++) {
                const player = createPlayer(i);
                grid.appendChild(player);
                players.push({
                    index: i,
                    logged: false,
                    account: null
                });
            }
            
            updateStats();
        }

        // Função global para login (chamada pelo botão)
        window.loginPlayer = function(index) {
            currentPlayerIndex = index;
            document.getElementById('modalTitle').textContent = `Login Player #${index+1}`;
            document.getElementById('loginModal').classList.add('active');
        };

        // Função para processar login
        function processLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            
            if (!user || !pass) {
                alert('Precisa de usuário e senha (use qualquer coisa para teste)');
                return;
            }
            
            const index = currentPlayerIndex;
            const player = players[index];
            
            if (!player.logged) {
                // Marca como logado
                player.logged = true;
                player.account = user;
                loggedCount++;
                
                // Atualiza UI
                document.getElementById(`status-${index}`).textContent = `🔒 ${user}`;
                document.getElementById(`status-${index}`).className = 'login-status logged';
                document.getElementById(`account-${index}`).textContent = `👤 ${user}`;
                
                // Remove overlay de login
                const overlay = document.getElementById(`overlay-${index}`);
                if (overlay) overlay.style.display = 'none';
                
                // Recarrega o iframe (agora com cookie de login)
                const iframe = document.getElementById(`iframe-${index}`);
                const parentDomain = window.location.hostname || 'localhost';
                iframe.src = `https://player.twitch.tv/?channel=${CHANNEL}&parent=${parentDomain}&muted=false&autoplay=true&t=${Date.now()}_${index}`;
                
                updateStats();
            }
            
            // Fecha modal e limpa campos
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
        }

        // Login em todos (simulado)
        function loginAll() {
            for (let i = 0; i < PLAYER_COUNT; i++) {
                const player = players[i];
                
                if (!player.logged) {
                    player.logged = true;
                    player.account = CONTAS_DEMO[i].user;
                    loggedCount++;
                    
                    document.getElementById(`status-${i}`).textContent = `🔒 ${CONTAS_DEMO[i].user}`;
                    document.getElementById(`status-${i}`).className = 'login-status logged';
                    document.getElementById(`account-${i}`).textContent = `👤 ${CONTAS_DEMO[i].user}`;
                    
                    const overlay = document.getElementById(`overlay-${i}`);
                    if (overlay) overlay.style.display = 'none';
                }
            }
            
            // Recarrega todos iframes
            setTimeout(() => {
                for (let i = 0; i < PLAYER_COUNT; i++) {
                    const iframe = document.getElementById(`iframe-${i}`);
                    const parentDomain = window.location.hostname || 'localhost';
                    iframe.src = `https://player.twitch.tv/?channel=${CHANNEL}&parent=${parentDomain}&muted=false&autoplay=true&t=${Date.now()}_${i}`;
                }
            }, 500);
            
            updateStats();
        }

        function updateStats() {
            document.getElementById('loggedCount').textContent = loggedCount;
            document.getElementById('viewerCount').textContent = loggedCount * 2 + Math.floor(Math.random() * 5);
        }

        // Event listeners
        document.getElementById('confirmLogin').addEventListener('click', processLogin);
        
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('loginModal').classList.remove('active');
        });
        
        document.getElementById('loginAllBtn').addEventListener('click', loginAll);
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Recarregar todos os players?')) {
                initializeGrid();
            }
        });

        // Fecha modal clicando fora
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('loginModal');
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        // Inicialização
        window.addEventListener('load', () => {
            initializeGrid();
            
            // Auto click para ajudar autoplay
            setTimeout(() => document.body.click(), 1000);
        });
    })();
</script>

</body>
</html>
