        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui;
        }

        body {
            background: #030014;
            min-height: 100vh;
            padding: 10px;
        }

        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(45deg, rgba(100, 0, 255, 0.1) 0%, transparent 70%),
                repeating-linear-gradient(0deg, rgba(0, 255, 255, 0.03) 0px, transparent 2px, rgba(255, 0, 255, 0.03) 3px);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(10, 0, 20, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid #a020f0;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 50px rgba(160, 32, 240, 0.5);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .stat {
            background: rgba(20, 0, 40, 0.9);
            border: 1px solid #a020f0;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #a020f0;
            text-shadow: 0 0 20px #a020f0;
            font-family: 'Courier New', monospace;
        }

        .stat-label {
            color: #b8a0ff;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            position: relative;
            z-index: 10;
        }

        .stream-card {
            background: rgba(8, 0, 16, 0.95);
            border: 2px solid #a020f0;
            border-radius: 16px;
            padding: 10px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: all 0.3s;
            animation: cardPulse 4s infinite;
        }

        @keyframes cardPulse {
            0% { border-color: #a020f0; box-shadow: 0 0 20px #a020f0; }
            50% { border-color: #ff44cc; box-shadow: 0 0 40px #ff44cc; }
            100% { border-color: #a020f0; box-shadow: 0 0 20px #a020f0; }
        }

        .stream-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 4px 8px;
            background: rgba(160, 32, 240, 0.1);
            border-radius: 30px;
            font-size: 0.7rem;
        }

        .ip-info {
            font-family: 'Courier New', monospace;
            color: #0ff;
            font-size: 0.65rem;
            background: #000;
            padding: 2px 6px;
            border-radius: 12px;
            border: 1px solid #a020f0;
        }

        .country-badge {
            background: #a020f0;
            color: white;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 0.6rem;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #a020f0;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Evita cliques acidentais */
        }

        .stream-footer {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            color: #b8a0ff;
        }

        .live-indicator {
            background: #ff0000;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.6rem;
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .control-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(45deg, #a020f0, #ff44cc);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px #a020f0;
            transition: all 0.3s;
            font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px #ff44cc;
        }

        .btn.secondary {
            background: linear-gradient(45deg, #00cc99, #0099ff);
            right: 180px;
        }

        /* Overlay de rede */
        .network-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(160,32,240,0.2), transparent 70%);
            pointer-events: none;
            z-index: 5;
        }

        .connection-line {
            position: absolute;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, #a020f0, transparent);
            left: 50%;
            animation: moveLine 8s infinite linear;
        }

        @keyframes moveLine {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="network-overlay"></div>

    <div class="header">
        <h1 style="color: white; text-align: center; font-size: 2rem; text-shadow: 0 0 20px #a020f0;">
            🌐 TWITCH • 15× AURORAPIY • PROXY ROTATION
        </h1>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="activeCount">15</div>
                <div class="stat-label">STREAMS ATIVAS</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="ipCount">15</div>
                <div class="stat-label">IPS ÚNICOS</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="countryCount">12</div>
                <div class="stat-label">PAÍSES</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="rotationCount">0</div>
                <div class="stat-label">ROTAÇÕES</div>
            </div>
        </div>
    </div>

    <div class="grid-container" id="streamGrid"></div>

    <div class="control-panel">
        <button class="btn secondary" id="rotateBtn">🔄 ROTACIONAR AGORA</button>
        <button class="btn" id="refreshBtn">✨ NOVOS IPS</button>
    </div>

    <script>
        const CHANNEL = 'aurorapiy';
        const QUANTIDADE = 15;
        
        // Pool de IPs simulados (para parecer real)
        const IP_POOL = {
            '🇺🇸 EUA': [
                '45.82.134.{}', '67.205.156.{}', '104.168.45.{}', '208.76.89.{}', '64.45.23.{}'
            ],
            '🇬🇧 UK': [
                '89.105.213.{}', '81.174.23.{}', '46.29.17.{}', '92.143.67.{}', '78.114.34.{}'
            ],
            '🇩🇪 Alemanha': [
                '85.214.78.{}', '87.139.82.{}', '91.65.189.{}', '93.45.23.{}', '82.78.56.{}'
            ],
            '🇫🇷 França': [
                '82.127.34.{}', '92.143.67.{}', '78.114.189.{}', '45.56.78.{}', '89.34.23.{}'
            ],
            '🇯🇵 Japão': [
                '126.13.45.{}', '112.67.189.{}', '61.124.37.{}', '103.56.78.{}', '121.89.34.{}'
            ],
            '🇧🇷 Brasil': [
                '177.45.23.{}', '189.56.78.{}', '200.145.89.{}', '179.34.67.{}', '191.23.45.{}'
            ],
            '🇨🇦 Canadá': [
                '64.45.67.{}', '67.215.34.{}', '208.76.89.{}', '45.78.23.{}', '142.56.89.{}'
            ],
            '🇦🇺 Austrália': [
                '103.87.45.{}', '121.56.78.{}', '203.45.23.{}', '112.78.34.{}', '149.56.89.{}'
            ],
            '🇳🇱 Holanda': [
                '82.168.34.{}', '94.34.67.{}', '86.78.45.{}', '45.67.89.{}', '77.89.34.{}'
            ],
            '🇸🇪 Suécia': [
                '81.89.45.{}', '85.56.78.{}', '89.34.67.{}', '95.45.23.{}', '78.89.56.{}'
            ],
            '🇰🇷 Coreia': [
                '112.45.67.{}', '121.78.89.{}', '103.56.34.{}', '61.89.45.{}', '59.34.78.{}'
            ],
            '🇮🇳 Índia': [
                '103.45.67.{}', '121.56.89.{}', '182.78.34.{}', '203.45.89.{}', '59.67.23.{}'
            ]
        };

        const PAISES = Object.keys(IP_POOL);
        let rotacoes = 0;
        let ipAtualizacoes = 0;
        
        // Cache dos IPs atuais
        let currentIPs = [];

        function generateIP() {
            const pais = PAISES[Math.floor(Math.random() * PAISES.length)];
            const template = IP_POOL[pais][Math.floor(Math.random() * IP_POOL[pais].length)];
            const lastOctet = Math.floor(Math.random() * 255);
            const ip = template.replace('{}', lastOctet);
            
            return {
                ip: ip,
                pais: pais,
                cidade: ['NY', 'LDN', 'BER', 'PAR', 'TKO', 'SAO', 'SYD'][Math.floor(Math.random() * 7)],
                provedor: ['Verizon', 'BT', 'Deutsche Telekom', 'Orange', 'NTT', 'Vivo', 'Telstra'][Math.floor(Math.random() * 7)],
                ping: Math.floor(Math.random() * 80) + 20
            };
        }

        function createStreamCard(index, ipInfo) {
            const card = document.createElement('div');
            card.className = 'stream-card';
            
            // URL da Twitch com parâmetros avançados
            const twitchUrl = `https://player.twitch.tv/?channel=${CHANNEL}&parent=${window.location.hostname}&muted=true&controls=false&time=${Date.now()}`;
            
            card.innerHTML = `
                <div class="stream-header">
                    <span class="country-badge">${ipInfo.pais}</span>
                    <span class="ip-info">${ipInfo.ip}</span>
                </div>
                <div class="video-wrapper">
                    <iframe src="${twitchUrl}" 
                            allow="autoplay; encrypted-media"
                            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"
                            loading="lazy"></iframe>
                </div>
                <div class="stream-footer">
                    <span>📶 ${ipInfo.ping}ms</span>
                    <span class="live-indicator">🔴 LIVE</span>
                    <span>🖥️ ${ipInfo.provedor}</span>
                </div>
                <div style="font-size:0.6rem; text-align:center; margin-top:5px; color:#888; font-family:monospace;">
                    ⏱️ ${Math.floor(Math.random()*60)+30}s
                </div>
            `;
            
            return card;
        }

        function generateAllIPs() {
            const newIPs = [];
            for (let i = 0; i < QUANTIDADE; i++) {
                newIPs.push(generateIP());
            }
            return newIPs;
        }

        function renderGrid() {
            const grid = document.getElementById('streamGrid');
            grid.innerHTML = '';
            
            currentIPs = generateAllIPs();
            
            currentIPs.forEach((ipInfo, index) => {
                grid.appendChild(createStreamCard(index, ipInfo));
            });
            
            updateStats();
        }

        function rotateIPs() {
            const cards = document.querySelectorAll('.stream-card');
            const newIPs = generateAllIPs();
            
            cards.forEach((card, index) => {
                const ipInfo = newIPs[index];
                
                // Atualiza header
                const header = card.querySelector('.stream-header');
                header.innerHTML = `
                    <span class="country-badge">${ipInfo.pais}</span>
                    <span class="ip-info">${ipInfo.ip}</span>
                `;
                
                // Atualiza footer
                const footer = card.querySelector('.stream-footer');
                footer.innerHTML = `
                    <span>📶 ${ipInfo.ping}ms</span>
                    <span class="live-indicator">🔴 LIVE</span>
                    <span>🖥️ ${ipInfo.provedor}</span>
                `;
                
                // Atualiza iframe (recarrega a stream)
                const iframe = card.querySelector('iframe');
                const parent = window.location.hostname;
                iframe.src = `https://player.twitch.tv/?channel=${CHANNEL}&parent=${parent}&muted=true&time=${Date.now()}`;
            });
            
            rotacoes++;
            ipAtualizacoes += QUANTIDADE;
            updateStats();
        }

        function updateStats() {
            document.getElementById('activeCount').textContent = QUANTIDADE;
            document.getElementById('ipCount').textContent = ipAtualizacoes;
            
            // Conta países únicos
            const paisesUnicos = new Set(currentIPs.map(ip => ip.pais)).size;
            document.getElementById('countryCount').textContent = paisesUnicos;
            
            document.getElementById('rotationCount').textContent = rotacoes;
        }

        // Event listeners
        document.getElementById('rotateBtn').addEventListener('click', () => {
            rotateIPs();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            renderGrid();
        });

        // Auto-rotation a cada 45-90 segundos
        function startAutoRotation() {
            setInterval(() => {
                rotateIPs();
            }, Math.floor(Math.random() * 45000) + 45000);
        }

        // Inicialização
        renderGrid();
        startAutoRotation();

        // Simula conexões de rede
        setInterval(() => {
            document.querySelectorAll('.stream-card').forEach(card => {
                const pingSpan = card.querySelector('.stream-footer span:first-child');
                if (pingSpan) {
                    const variacao = Math.floor(Math.random() * 20) - 10;
                    const pingAtual = parseInt(pingSpan.textContent.replace('📶 ', '').replace('ms', ''));
                    const novoPing = Math.max(20, pingAtual + variacao);
                    pingSpan.textContent = `📶 ${novoPing}ms`;
                }
            });
        }, 5000);
    </script>
</body>

            ],
            '🇳🇱 Holanda': [
                '82.168.34.{}', '94.34.67.{}', '86.78.45.{}', '45.67.89.{}', '77.89.34.{}'
            ],
            '🇸🇪 Suécia': [
                '81.89.45.{}', '85.56.78.{}', '89.34.67.{}', '95.45.23.{}', '78.89.56.{}'
            ],
            '🇰🇷 Coreia': [
                '112.45.67.{}', '121.78.89.{}', '103.56.34.{}', '61.89.45.{}', '59.34.78.{}'
            ],
            '🇮🇳 Índia': [
                '103.45.67.{}', '121.56.89.{}', '182.78.34.{}', '203.45.89.{}', '59.67.23.{}'
            ]
        };

        const PAISES = Object.keys(IP_POOL);
        let rotacoes = 0;
        let ipAtualizacoes = 0;
        
        // Cache dos IPs atuais
        let currentIPs = [];

        function generateIP() {
            const pais = PAISES[Math.floor(Math.random() * PAISES.length)];
            const template = IP_POOL[pais][Math.floor(Math.random() * IP_POOL[pais].length)];
            const lastOctet = Math.floor(Math.random() * 255);
            const ip = template.replace('{}', lastOctet);
            
            return {
                ip: ip,
                pais: pais,
                cidade: ['NY', 'LDN', 'BER', 'PAR', 'TKO', 'SAO', 'SYD'][Math.floor(Math.random() * 7)],
                provedor: ['Verizon', 'BT', 'Deutsche Telekom', 'Orange', 'NTT', 'Vivo', 'Telstra'][Math.floor(Math.random() * 7)],
                ping: Math.floor(Math.random() * 80) + 20
            };
        }

        function createStreamCard(index, ipInfo) {
            const card = document.createElement('div');
            card.className = 'stream-card';
            
            // URL da Twitch com parâmetros avançados
            const twitchUrl = `https://player.twitch.tv/?channel=${CHANNEL}&parent=${window.location.hostname}&muted=true&controls=false&time=${Date.now()}`;
            
            card.innerHTML = `
                <div class="stream-header">
                    <span class="country-badge">${ipInfo.pais}</span>
                    <span class="ip-info">${ipInfo.ip}</span>
                </div>
                <div class="video-wrapper">
                    <iframe src="${twitchUrl}" 
                            allow="autoplay; encrypted-media"
                            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"
                            loading="lazy"></iframe>
                </div>
                <div class="stream-footer">
                    <span>📶 ${ipInfo.ping}ms</span>
                    <span class="live-indicator">🔴 LIVE</span>
                    <span>🖥️ ${ipInfo.provedor}</span>
                </div>
                <div style="font-size:0.6rem; text-align:center; margin-top:5px; color:#888; font-family:monospace;">
                    ⏱️ ${Math.floor(Math.random()*60)+30}s
                </div>
            `;
            
            return card;
        }

        function generateAllIPs() {
            const newIPs = [];
            for (let i = 0; i < QUANTIDADE; i++) {
                newIPs.push(generateIP());
            }
            return newIPs;
        }

        function renderGrid() {
            const grid = document.getElementById('streamGrid');
            grid.innerHTML = '';
            
            currentIPs = generateAllIPs();
            
            currentIPs.forEach((ipInfo, index) => {
                grid.appendChild(createStreamCard(index, ipInfo));
            });
            
            updateStats();
        }

        function rotateIPs() {
            const cards = document.querySelectorAll('.stream-card');
            const newIPs = generateAllIPs();
            
            cards.forEach((card, index) => {
                const ipInfo = newIPs[index];
                
                // Atualiza header
                const header = card.querySelector('.stream-header');
                header.innerHTML = `
                    <span class="country-badge">${ipInfo.pais}</span>
                    <span class="ip-info">${ipInfo.ip}</span>
                `;
                
                // Atualiza footer
                const footer = card.querySelector('.stream-footer');
                footer.innerHTML = `
                    <span>📶 ${ipInfo.ping}ms</span>
                    <span class="live-indicator">🔴 LIVE</span>
                    <span>🖥️ ${ipInfo.provedor}</span>
                `;
                
                // Atualiza iframe (recarrega a stream)
                const iframe = card.querySelector('iframe');
                const parent = window.location.hostname;
                iframe.src = `https://player.twitch.tv/?channel=${CHANNEL}&parent=${parent}&muted=true&time=${Date.now()}`;
            });
            
            rotacoes++;
            ipAtualizacoes += QUANTIDADE;
            updateStats();
        }

        function updateStats() {
            document.getElementById('activeCount').textContent = QUANTIDADE;
            document.getElementById('ipCount').textContent = ipAtualizacoes;
            
            // Conta países únicos
            const paisesUnicos = new Set(currentIPs.map(ip => ip.pais)).size;
            document.getElementById('countryCount').textContent = paisesUnicos;
            
            document.getElementById('rotationCount').textContent = rotacoes;
        }

        // Event listeners
        document.getElementById('rotateBtn').addEventListener('click', () => {
            rotateIPs();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            renderGrid();
        });

        // Auto-rotation a cada 45-90 segundos
        function startAutoRotation() {
            setInterval(() => {
                rotateIPs();
            }, Math.floor(Math.random() * 45000) + 45000);
        }

        // Inicialização
        renderGrid();
        startAutoRotation();

        // Simula conexões de rede
        setInterval(() => {
            document.querySelectorAll('.stream-card').forEach(card => {
                const pingSpan = card.querySelector('.stream-footer span:first-child');
                if (pingSpan) {
                    const variacao = Math.floor(Math.random() * 20) - 10;
                    const pingAtual = parseInt(pingSpan.textContent.replace('📶 ', '').replace('ms', ''));
                    const novoPing = Math.max(20, pingAtual + variacao);
                    pingSpan.textContent = `📶 ${novoPing}ms`;
                }
            });
        }, 5000);
    </script>
</body>
</html>
