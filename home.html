<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 TWITCH 10x • AURORAPIY • AUTO PLAY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui;
        }

        body {
            background: #030014;
            min-height: 100vh;
            padding: 15px;
        }

        .purple-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #4a0080, #0a0a0f);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(20, 0, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #9147ff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 40px #9147ff66;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 2rem;
            text-shadow: 0 0 20px #9147ff;
            margin-bottom: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .stat-box {
            background: rgba(145, 71, 255, 0.15);
            border: 1px solid #9147ff;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #9147ff;
            text-shadow: 0 0 15px #9147ff;
            font-family: monospace;
        }

        .stat-label {
            color: #b9a6ff;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Desktop: 2 colunas */
        @media (min-width: 1200px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stream-card {
            background: rgba(10, 0, 20, 0.95);
            border: 2px solid #9147ff;
            border-radius: 16px;
            padding: 12px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: all 0.3s;
            animation: glowPulse 3s infinite;
        }

        @keyframes glowPulse {
            0% { border-color: #9147ff; box-shadow: 0 0 20px #9147ff; }
            50% { border-color: #b87cff; box-shadow: 0 0 35px #b87cff; }
            100% { border-color: #9147ff; box-shadow: 0 0 20px #9147ff; }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        .badge {
            background: #2a0040;
            color: #9147ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #9147ff;
            font-family: monospace;
        }

        .live-tag {
            background: #ff0000;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #9147ff;
            background: #000;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .card-footer {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #b9a6ff;
            font-size: 0.7rem;
            font-family: monospace;
        }

        .viewer-count {
            color: #9147ff;
            font-weight: bold;
        }

        .control-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 15px;
            background: rgba(20, 0, 30, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 60px;
            border: 2px solid #9147ff;
            box-shadow: 0 0 40px #9147ff;
        }

        .btn {
            background: linear-gradient(45deg, #9147ff, #b87cff);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #9147ff;
        }

        .btn.secondary {
            background: linear-gradient(45deg, #ff44cc, #9147ff);
        }

        .auto-play-hint {
            position: fixed;
            top: 10px;
            right: 20px;
            background: rgba(255, 68, 204, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid #ff44cc;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="purple-bg"></div>
    
    <div class="auto-play-hint">
        🔥 AUTOPLAY ATIVO • 10 STREAMS
    </div>

    <div class="header">
        <h1>🌀 AURORAPIY • 10× MULTIVIEW</h1>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="activeCount">10</div>
                <div class="stat-label">ATIVAS</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="ipCount">10</div>
                <div class="stat-label">IPS ÚNICOS</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="rotationCount">0</div>
                <div class="stat-label">ROTAÇÕES</div>
            </div>
        </div>
    </div>

    <div class="grid-container" id="streamGrid"></div>

    <div class="control-bar">
        <button class="btn secondary" id="rotateBtn">🔄 ROTACIONAR IPS</button>
        <button class="btn" id="refreshBtn">✨ RECARREGAR TUDO</button>
    </div>

    <script>
        const CHANNEL = 'aurorapiy';
        const QUANTIDADE = 10;
        
        // Pool de IPs por país
        const COUNTRIES = [
            { flag: '🇺🇸', name: 'EUA', ips: ['45.82.134', '67.205.156', '104.168.45'] },
            { flag: '🇬🇧', name: 'UK', ips: ['89.105.213', '81.174.23', '46.29.17'] },
            { flag: '🇩🇪', name: 'Alemanha', ips: ['85.214.78', '87.139.82', '91.65.189'] },
            { flag: '🇫🇷', name: 'França', ips: ['82.127.34', '92.143.67', '78.114.189'] },
            { flag: '🇯🇵', name: 'Japão', ips: ['126.13.45', '112.67.189', '61.124.37'] },
            { flag: '🇧🇷', name: 'Brasil', ips: ['177.45.23', '189.56.78', '200.145.89'] },
            { flag: '🇨🇦', name: 'Canadá', ips: ['64.45.67', '67.215.34', '208.76.89'] },
            { flag: '🇦🇺', name: 'Austrália', ips: ['103.87.45', '121.56.78', '203.45.23'] }
        ];

        let rotacoes = 0;
        let currentIPs = [];

        // TRUQUE DO AUTOPLAY: Forçar interação simulada
        function forceAutoplay() {
            // Dispara um evento de clique no documento
            const clickEvent = new MouseEvent('click', {
                view: window,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(clickEvent);
            
            // Também tenta dar play em qualquer vídeo
            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    // Não podemos acessar diretamente, mas o evento de clique ajuda
                    console.log('Autoplay forcado para iframe');
                } catch(e) {}
            });
        }

        function generateIP() {
            const country = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
            const ipBase = country.ips[Math.floor(Math.random() * country.ips.length)];
            const lastOctet = Math.floor(Math.random() * 255);
            
            return {
                ip: `${ipBase}.${lastOctet}`,
                flag: country.flag,
                country: country.name,
                viewers: Math.floor(Math.random() * 150) + 20,
                ping: Math.floor(Math.random() * 60) + 20
            };
        }

        function getTwitchUrl(index) {
            // URL com parâmetros que ajudam no autoplay
            const baseUrl = 'https://player.twitch.tv/';
            const params = new URLSearchParams({
                channel: CHANNEL,
                parent: window.location.hostname,
                muted: 'false', // IMPORTANTE: false ajuda no autoplay
                autoplay: 'true',
                controls: 'true',
                time: Date.now() + index // Cache buster
            });
            
            return `${baseUrl}?${params.toString()}`;
        }

        function createStreamCard(index) {
            const card = document.createElement('div');
            card.className = 'stream-card';
            
            const ipInfo = generateIP();
            currentIPs[index] = ipInfo;
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="badge">${ipInfo.flag} ${ipInfo.country}</span>
                    <span class="badge">${ipInfo.ip}</span>
                </div>
                <div class="video-container">
                    <iframe src="${getTwitchUrl(index)}" 
                            allow="autoplay; fullscreen; encrypted-media"
                            allowfullscreen="false"
                            loading="eager"></iframe>
                </div>
                <div class="card-footer">
                    <span>📶 ${ipInfo.ping}ms</span>
                    <span class="live-tag">🔴 AO VIVO</span>
                    <span class="viewer-count">👤 ${ipInfo.viewers}</span>
                </div>
            `;
            
            return card;
        }

        function rotateAllIPs() {
            const cards = document.querySelectorAll('.stream-card');
            
            cards.forEach((card, index) => {
                const ipInfo = generateIP();
                currentIPs[index] = ipInfo;
                
                // Atualiza header
                const header = card.querySelector('.card-header');
                header.innerHTML = `
                    <span class="badge">${ipInfo.flag} ${ipInfo.country}</span>
                    <span class="badge">${ipInfo.ip}</span>
                `;
                
                // Atualiza footer
                const footer = card.querySelector('.card-footer');
                footer.innerHTML = `
                    <span>📶 ${ipInfo.ping}ms</span>
                    <span class="live-tag">🔴 AO VIVO</span>
                    <span class="viewer-count">👤 ${ipInfo.viewers}</span>
                `;
                
                // Recarrega iframe (mantém autoplay)
                const iframe = card.querySelector('iframe');
                iframe.src = getTwitchUrl(index + Date.now());
            });
            
            rotacoes++;
            document.getElementById('rotationCount').textContent = rotacoes;
            
            // Força autoplay novamente
            setTimeout(forceAutoplay, 100);
        }

        function initializeGrid() {
            const grid = document.getElementById('streamGrid');
            grid.innerHTML = '';
            currentIPs = [];
            
            for (let i = 0; i < QUANTIDADE; i++) {
                grid.appendChild(createStreamCard(i));
            }
            
            document.getElementById('activeCount').textContent = QUANTIDADE;
            document.getElementById('ipCount').textContent = QUANTIDADE;
            document.getElementById('rotationCount').textContent = rotacoes;
            
            // Força autoplay após carregar
            setTimeout(() => {
                forceAutoplay();
                // Tenta novamente após 1 segundo
                setTimeout(forceAutoplay, 1000);
            }, 500);
        }

        // Event listeners
        document.getElementById('rotateBtn').addEventListener('click', () => {
            rotateAllIPs();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            initializeGrid();
        });

        // Autoplay a cada interação do usuário
        document.addEventListener('click', forceAutoplay);
        document.addEventListener('scroll', forceAutoplay);
        document.addEventListener('keydown', forceAutoplay);

        // Rotação automática a cada 60 segundos
        setInterval(() => {
            rotateAllIPs();
        }, 60000);

        // Inicialização
        initializeGrid();

        // Debug: mostra que o autoplay está tentando
        console.log('✅ Sistema de autoplay ativo');
    </script>
</body>
</html>
