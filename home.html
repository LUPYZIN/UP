<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 TWITCH MULTIVIEW • AuroraPIY • Proxy Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', monospace;
        }

        body {
            min-height: 100vh;
            background: #0a0c0f;
            padding: 20px;
        }

        .purple-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #4b0082, #0a0c0f);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(75, 0, 130, 0.8);
            border: 2px solid #9147ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            color: #fff;
            box-shadow: 0 0 30px rgba(145, 71, 255, 0.5);
            backdrop-filter: blur(5px);
        }

        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(20, 0, 30, 0.9);
            border: 1px solid #9147ff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box .label {
            color: #b87cff;
            opacity: 0.9;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-box .value {
            font-size: 2rem;
            font-weight: bold;
            color: #9147ff;
            text-shadow: 0 0 15px #9147ff;
            font-family: 'Courier New', monospace;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            position: relative;
            z-index: 10;
        }

        .video-card {
            background: rgba(20, 0, 30, 0.95);
            border: 2px solid #9147ff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(145, 71, 255, 0.3);
            transition: all 0.3s ease;
            animation: purplePulse 3s infinite;
        }

        @keyframes purplePulse {
            0% { box-shadow: 0 0 20px rgba(145, 71, 255, 0.3); }
            50% { box-shadow: 0 0 40px rgba(145, 71, 255, 0.6); }
            100% { box-shadow: 0 0 20px rgba(145, 71, 255, 0.3); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #9147ff;
        }

        .window-title {
            color: #9147ff;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .ip-badge {
            background: #000;
            color: #9147ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            border: 1px solid #9147ff;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border: 2px solid #9147ff;
            border-radius: 8px;
            overflow: hidden;
            margin: 10px 0;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .channel-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 8px;
            background: rgba(75, 0, 130, 0.3);
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }

        .live-badge {
            background: #ff0000;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .viewer-count {
            color: #9147ff;
        }

        .reload-timer {
            background: #000;
            color: #9147ff;
            padding: 5px 10px;
            border-radius: 4px;
            text-align: center;
            margin-top: 8px;
            font-size: 0.8rem;
            border: 1px dashed #9147ff;
        }

        .control-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(75, 0, 130, 0.9);
            border: 2px solid #9147ff;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #9147ff;
            color: #000;
            box-shadow: 0 0 30px #9147ff;
        }

        .twitch-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .twitch-logo img {
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>
    <div class="purple-bg"></div>

    <div class="header">
        <div class="twitch-logo">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="#9147ff">
                <path d="M11.64 5.93h1.43v4.28h-1.43m3.93-4.28H17v4.28h-1.43M7 2L3.43 5.57v12.86h4.28V22l3.58-3.57h2.86L20.57 12V2m-1.43 9.29l-2.85 2.85h-2.86l-2.5 2.5v-2.5H7.71V3.43h11.43v7.86z"/>
            </svg>
            <h1>🌀 AURORAPIY • MULTIVIEW PROXY SIMULATOR 🌀</h1>
        </div>
        
        <div class="stats-panel">
            <div class="stat-box">
                <div class="label">STREAMS ATIVAS</div>
                <div class="value" id="activeStreams">15</div>
            </div>
            <div class="stat-box">
                <div class="label">PAÍSES</div>
                <div class="value" id="countries">12</div>
            </div>
            <div class="stat-box">
                <div class="label">VIEWERS SIM.</div>
                <div class="value" id="viewers">0</div>
            </div>
            <div class="stat-box">
                <div class="label">STATUS</div>
                <div class="value" id="status">🟢 LIVE</div>
            </div>
        </div>
    </div>

    <div class="video-grid" id="videoGrid"></div>

    <div class="control-panel">
        <button class="btn" id="rotateAll">🔄 ROTACIONAR IPS</button>
        <button class="btn" id="newIPs">🌐 NOVOS IPS</button>
    </div>

    <script>
        const CHANNEL_NAME = 'aurorapiy';
        const QUANTIDADE = 15;
        let rotacoes = 0;
        let viewersSimulados = 0;
        
        // Banco de IPs simulados por país
        const ipPools = {
            '🇺🇸 EUA': ['45.82.134.' + Math.floor(Math.random() * 255), '67.205.156.' + Math.floor(Math.random() * 255)],
            '🇬🇧 UK': ['89.105.213.' + Math.floor(Math.random() * 255), '81.174.23.' + Math.floor(Math.random() * 255)],
            '🇩🇪 Alemanha': ['85.214.78.' + Math.floor(Math.random() * 255), '87.139.82.' + Math.floor(Math.random() * 255)],
            '🇫🇷 França': ['82.127.34.' + Math.floor(Math.random() * 255), '92.143.67.' + Math.floor(Math.random() * 255)],
            '🇯🇵 Japão': ['126.13.45.' + Math.floor(Math.random() * 255), '112.67.189.' + Math.floor(Math.random() * 255)],
            '🇧🇷 Brasil': ['177.45.23.' + Math.floor(Math.random() * 255), '189.56.78.' + Math.floor(Math.random() * 255)],
            '🇨🇦 Canadá': ['64.45.67.' + Math.floor(Math.random() * 255), '67.215.34.' + Math.floor(Math.random() * 255)],
            '🇦🇺 Austrália': ['103.87.45.' + Math.floor(Math.random() * 255), '121.56.78.' + Math.floor(Math.random() * 255)],
            '🇳🇱 Holanda': ['82.168.34.' + Math.floor(Math.random() * 255), '94.34.67.' + Math.floor(Math.random() * 255)],
            '🇸🇪 Suécia': ['81.89.45.' + Math.floor(Math.random() * 255), '85.56.78.' + Math.floor(Math.random() * 255)]
        };

        const paises = Object.keys(ipPools);

        function generateRandomIP() {
            const pais = paises[Math.floor(Math.random() * paises.length)];
            const pool = ipPools[pais];
            const ipBase = pool[Math.floor(Math.random() * pool.length)];
            const lastOctet = Math.floor(Math.random() * 255);
            return {
                ip: ipBase.includes('.') ? ipBase.split('.')[0] + '.' + ipBase.split('.')[1] + '.' + ipBase.split('.')[2] + '.' + lastOctet : ipBase,
                pais: pais,
                ping: Math.floor(Math.random() * 150) + 20,
                viewers: Math.floor(Math.random() * 50) + 10
            };
        }

        function createStreamCard(index) {
            const card = document.createElement('div');
            card.className = 'video-card';
            
            const ipInfo = generateRandomIP();
            viewersSimulados += ipInfo.viewers;
            
            // Twitch embed URL - modo mais compatível
            const twitchUrl = `https://player.twitch.tv/?channel=${CHANNEL_NAME}&parent=${window.location.hostname}&muted=true`;
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="window-title">📺 STREAM #${String(index + 1).padStart(2, '0')}</span>
                    <span class="ip-badge">${ipInfo.ip}</span>
                </div>
                <div class="video-container">
                    <iframe src="${twitchUrl}" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen="false"
                            title="AuroraPIY Twitch"></iframe>
                </div>
                <div class="channel-info">
                    <span class="country-flag">${ipInfo.pais}</span>
                    <span class="live-badge">🔴 LIVE</span>
                    <span class="viewer-count">👥 ${ipInfo.viewers} viewers</span>
                </div>
                <div class="reload-timer" id="timer-${index}">
                    ⏳ Próximo IP em: ${Math.floor(Math.random() * 60) + 30}s
                </div>
            `;
            
            return card;
        }

        function updateAllIPs() {
            viewersSimulados = 0;
            const cards = document.querySelectorAll('.video-card');
            
            cards.forEach((card, index) => {
                const ipInfo = generateRandomIP();
                const ipBadge = card.querySelector('.ip-badge');
                const channelInfo = card.querySelector('.channel-info');
                const timer = card.querySelector('.reload-timer');
                
                if (ipBadge) ipBadge.textContent = ipInfo.ip;
                if (channelInfo) {
                    channelInfo.innerHTML = `
                        <span class="country-flag">${ipInfo.pais}</span>
                        <span class="live-badge">🔴 LIVE</span>
                        <span class="viewer-count">👥 ${ipInfo.viewers} viewers</span>
                    `;
                }
                if (timer) {
                    const segundos = Math.floor(Math.random() * 60) + 30;
                    timer.textContent = `⏳ Próximo IP em: ${segundos}s`;
                }
                
                viewersSimulados += ipInfo.viewers;
            });
            
            rotacoes++;
            document.getElementById('viewers').textContent = viewersSimulados;
            document.getElementById('rotations').textContent = rotacoes;
            
            // Atualiza os iframes (recarrega as streams)
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach((iframe, i) => {
                // Recarrega o iframe da Twitch (precisa de um truque para não quebrar)
                const parent = window.location.hostname;
                iframe.src = `https://player.twitch.tv/?channel=${CHANNEL_NAME}&parent=${parent}&t=${Date.now()}`;
            });
        }

        function initializeGrid() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            viewersSimulados = 0;
            
            for (let i = 0; i < QUANTIDADE; i++) {
                const card = createStreamCard(i);
                grid.appendChild(card);
            }
            
            document.getElementById('activeStreams').textContent = QUANTIDADE;
            document.getElementById('countries').textContent = Object.keys(ipPools).length;
            document.getElementById('viewers').textContent = viewersSimulados;
            document.getElementById('rotations').textContent = rotacoes;
        }

        function startAutoRotation() {
            setInterval(() => {
                updateAllIPs();
            }, Math.floor(Math.random() * 60000) + 30000);
        }

        // Event listeners
        document.getElementById('rotateAll').addEventListener('click', () => {
            updateAllIPs();
        });

        document.getElementById('newIPs').addEventListener('click', () => {
            // Gera novos pools de IPs
            Object.keys(ipPools).forEach(pais => {
                ipPools[pais] = [
                    Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255),
                    Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255)
                ];
            });
            updateAllIPs();
        });

        // Inicialização
        initializeGrid();
        startAutoRotation();

        // Atualiza timers visualmente
        setInterval(() => {
            const timers = document.querySelectorAll('.reload-timer');
            timers.forEach(timer => {
                const text = timer.textContent;
                const match = text.match(/(\d+)/);
                if (match) {
                    let segundos = parseInt(match[0]);
                    if (segundos > 0) {
                        segundos--;
                        timer.textContent = `⏳ Próximo IP em: ${segundos}s`;
                    }
                }
            });
        }, 1000);
    </script>
</body>
</html>
