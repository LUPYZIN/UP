<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Loop de Poppy Playtime • 10+ Janelas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1a0b2e, #0c0a1a);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        /* cabeçalho com título e contador */
        .top-bar {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 70, 200, 0.25);
            border-radius: 60px;
            padding: 16px 30px;
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(180, 0, 255, 0.3);
        }

        .title-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .title-section h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff7bcf, #b380ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 0 15px #ff44cc80;
        }

        .badge {
            background: #38006b;
            border: 1px solid #ff66d0;
            color: #ffd6f5;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: inset 0 2px 5px #00000055, 0 0 15px #ff33bb;
        }

        .stats {
            display: flex;
            gap: 25px;
            color: #ccc9f0;
            font-weight: 500;
        }

        .stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats i {
            font-size: 1.4rem;
            filter: drop-shadow(0 0 8px magenta);
        }

        /* grid principal das janelas */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            flex: 1;
            z-index: 2;
            margin-bottom: 30px;
        }

        /* cada card = janelinha */
        .video-card {
            background: rgba(18, 8, 31, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 20, 180, 0.5);
            border-radius: 32px;
            padding: 14px 14px 18px 14px;
            box-shadow: 0 30px 30px -15px black, 0 0 0 1px #ff44bb33 inset, 0 0 25px #b936ee60;
            transition: transform 0.2s ease, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .video-card:hover {
            transform: scale(1.02) translateY(-6px);
            border-color: #ff90e0;
            box-shadow: 0 35px 35px -15px #000, 0 0 30px #f0f;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 0 6px;
        }

        .window-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff4477;
            box-shadow: 0 0 15px #ff4466;
        }

        .window-dot:nth-child(2) {
            background: #ffbb33;
            box-shadow: 0 0 12px #ffaa00;
        }

        .window-dot:nth-child(3) {
            background: #33dd88;
            box-shadow: 0 0 10px #22ee88;
        }

        .window-title {
            flex: 1;
            text-align: right;
            font-size: 0.9rem;
            color: #e0b0ff;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-shadow: 0 0 5px violet;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #ffa0e0;
            box-shadow: 0 10px 20px #00000099;
            background: #11001c;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* bloqueia clique acidental, mas reload funciona */
        }

        /* tag de tempo aleatório */
        .reload-timer {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffcef0;
            padding: 0 6px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .timer-badge {
            background: #2e0047;
            border-radius: 30px;
            padding: 4px 16px;
            border: 1px solid #ff66bb;
            color: #ffd7fd;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 0 10px #ff3399;
        }

        .reload-icon {
            font-size: 1.3rem;
            filter: drop-shadow(0 0 5px cyan);
            animation: subtle-spin 8s infinite linear;
        }

        @keyframes subtle-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* luzes de fundo flutuantes (decor) */
        .glow-spot {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle at 30% 30%, #ff33ee20, transparent 70%);
            border-radius: 50%;
            top: -100px;
            left: -150px;
            z-index: 1;
            pointer-events: none;
        }

        .glow-spot2 {
            position: fixed;
            bottom: -100px;
            right: -50px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #7700ff30, transparent 75%);
            z-index: 1;
            pointer-events: none;
        }

        /* rodapé com botão de reset manual */
        .footer-controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 10;
            margin-top: 15px;
        }

        .footer-btn {
            background: rgba(30, 10, 40, 0.7);
            backdrop-filter: blur(10px);
            border: 1.5px solid #ff77cc;
            color: #ffe3f9;
            padding: 14px 32px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 30px #c445ff;
        }

        .footer-btn:hover {
            background: #3f1a5c;
            border-color: #ffaaf0;
            box-shadow: 0 0 45px #ff66ee;
            transform: scale(1.05);
        }

        .footer-btn:active {
            transform: scale(0.98);
        }

        /* mensagem de quantidade */
        .count-message {
            color: #cab8ff;
            font-size: 1rem;
            background: #00000040;
            border-radius: 30px;
            padding: 8px 20px;
            border: 1px dashed #ff66b8;
        }
    </style>
</head>
<body>

<div class="glow-spot"></div>
<div class="glow-spot2"></div>

<div class="top-bar">
    <div class="title-section">
        <h1>🌀 POPPY PLAYROOM</h1>
        <div class="badge" id="janelaCounter">10 JANELAS</div>
    </div>
    <div class="stats">
        <span>⏳ <span id="totalReloads">0</span> reloads</span>
        <span>🔄 <span id="ativoAgora">10</span> ativas</span>
    </div>
</div>

<!-- grid de vídeos será preenchido via JS -->
<div class="video-grid" id="videoGrid"></div>

<div class="footer-controls">
    <button class="footer-btn" id="recarregarTodasBtn">🔄 RECARREGAR TODAS AGORA</button>
    <button class="footer-btn" id="resetTimerBtn">⏱️ NOVO CICLO ALEATÓRIO</button>
</div>

<div style="text-align: center; margin: 20px 0 5px; z-index: 10;">
    <span class="count-message">✨ cada janela reinicia em minutos aleatórios (entre 0:45 e 3:15) ✨</span>
</div>

<script>
    (function() {
        // ID do vídeo do YouTube (extraído do link que você enviou)
        const VIDEO_ID = 'IAeYtSJ9oMY';
        const BASE_URL = `https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&mute=1&enablejsapi=1&controls=1&modestbranding=1&rel=0`;

        // configurações das janelas
        const QUANTIDADE_JANELAS = 15;  // mais de 10, fica bem visual
        const INTERVALO_MIN_SEG = 45;    // 45 segundos
        const INTERVALO_MAX_SEG = 195;   // 3 minutos e 15 segundos (195s)

        let totalReloads = 0;
        const contadores = [];            // armazena timeouts
        const iframes = [];               // referências aos iframes

        // elemento do contador de reloads
        const totalReloadsSpan = document.getElementById('totalReloads');
        const janelaCounterSpan = document.getElementById('janelaCounter');
        const ativoAgoraSpan = document.getElementById('ativoAgora');

        // grid
        const grid = document.getElementById('videoGrid');

        // função para gerar número aleatório entre min e max (segundos)
        function getRandomReloadSeconds() {
            return Math.floor(Math.random() * (INTERVALO_MAX_SEG - INTERVALO_MIN_SEG + 1)) + INTERVALO_MIN_SEG;
        }

        // atualiza contadores na UI
        function atualizaUI() {
            totalReloadsSpan.textContent = totalReloads;
            janelaCounterSpan.textContent = `${QUANTIDADE_JANELAS} JANELAS`;
            ativoAgoraSpan.textContent = QUANTIDADE_JANELAS;  // nesse contexto todas ativas
        }

        // método para recarregar um iframe específico (pelo índice)
        function reloadIframeByIndex(index) {
            const iframe = iframes[index];
            if (iframe) {
                // incrementa contador global
                totalReloads++;
                totalReloadsSpan.textContent = totalReloads;

                // pequeno efeito visual: pisca borda
                const card = iframe.closest('.video-card');
                if (card) {
                    card.style.transition = 'border 0.1s';
                    card.style.borderColor = '#ff55ff';
                    card.style.boxShadow = '0 0 40px #ff00c8';
                    setTimeout(() => {
                        if (card) {
                            card.style.borderColor = '';
                            card.style.boxShadow = '';
                        }
                    }, 200);
                }

                // recarrega o iframe: muda o src para ele mesmo (com um timestamp pra forçar)
                const currentSrc = iframe.src.split('?')[0]; // tira params antigos
                const timestamp = Date.now();
                // preserva autoplay e mute
                iframe.src = `${currentSrc}?autoplay=1&mute=1&enablejsapi=1&controls=1&modestbranding=1&rel=0&_=${timestamp}`;
            }
        }

        // agenda o reload para uma janela específica
        function agendarReload(index) {
            // limpa timer anterior se existir
            if (contadores[index]) {
                clearTimeout(contadores[index]);
            }

            const segundos = getRandomReloadSeconds();
            const milissegundos = segundos * 1000;

            // atualiza o span do timer na card (se existir)
            const card = document.querySelectorAll('.video-card')[index];
            if (card) {
                const timerSpan = card.querySelector('.timer-badge');
                if (timerSpan) {
                    const mins = Math.floor(segundos / 60);
                    const secs = segundos % 60;
                    timerSpan.textContent = `🕒 ${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
            }

            // agenda novo reload
            contadores[index] = setTimeout(() => {
                // reload no iframe
                reloadIframeByIndex(index);
                // re-agenda para o mesmo índice
                agendarReload(index);
            }, milissegundos);
        }

        // criar todas as janelas
        function criarJanelas() {
            grid.innerHTML = ''; // limpa
            // limpa arrays e timers antigos
            for (let i = 0; i < contadores.length; i++) {
                if (contadores[i]) clearTimeout(contadores[i]);
            }
            contadores.length = 0;
            iframes.length = 0;

            for (let i = 0; i < QUANTIDADE_JANELAS; i++) {
                // cria card
                const card = document.createElement('div');
                card.className = 'video-card';

                // header com bolinhas (mac style)
                const header = document.createElement('div');
                header.className = 'card-header';
                header.innerHTML = `
                    <span class="window-dot"></span>
                    <span class="window-dot"></span>
                    <span class="window-dot"></span>
                    <span class="window-title">🪀 JANELA #${i+1}</span>
                `;

                // container do iframe
                const videoContainer = document.createElement('div');
                videoContainer.className = 'video-container';

                const iframe = document.createElement('iframe');
                // src inicial com mute para não explodir som de todas ao mesmo tempo, mas autoplay
                iframe.src = `${BASE_URL}&mute=1&_init=${i}`;  // mute inicial, mas pode ser alterado pelo usuário
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = false;
                iframe.title = `Poppy Playtime Janela ${i+1}`;

                videoContainer.appendChild(iframe);
                iframes.push(iframe);  // guarda referência

                // rodapé com timer
                const footerTimer = document.createElement('div');
                footerTimer.className = 'reload-timer';
                footerTimer.innerHTML = `
                    <span class="timer-badge">⏳ calculando…</span>
                    <span class="reload-icon">🔄</span>
                `;

                card.appendChild(header);
                card.appendChild(videoContainer);
                card.appendChild(footerTimer);
                grid.appendChild(card);

                // agenda reload pra esta janela (primeira vez)
                // mas antes precisamos guardar o contador, vamos fazer após todos criados
            }

            // agora que todos os iframes existem, agendamos os reloads
            for (let i = 0; i < QUANTIDADE_JANELAS; i++) {
                agendarReload(i);
            }

            // atualiza UI
            atualizaUI();
        }

        // reinicia todos os timers (novos ciclos aleatórios)
        function resetAllTimers() {
            for (let i = 0; i < QUANTIDADE_JANELAS; i++) {
                // cancela timer atual
                if (contadores[i]) {
                    clearTimeout(contadores[i]);
                }
                // agenda novamente
                agendarReload(i);
            }
            // feedback rápido: piscar todas bordas
            document.querySelectorAll('.video-card').forEach(card => {
                card.style.transition = 'border 0.15s';
                card.style.borderColor = '#b7ff9e';
                card.style.boxShadow = '0 0 35px #76ff7e';
                setTimeout(() => {
                    card.style.borderColor = '';
                    card.style.boxShadow = '';
                }, 300);
            });
        }

        // recarrega todas as janelas manualmente
        function recarregarTodasJanelas() {
            for (let i = 0; i < iframes.length; i++) {
                reloadIframeByIndex(i);
                // reseta o timer dessa janela (para não dar reload junto do antigo)
                if (contadores[i]) {
                    clearTimeout(contadores[i]);
                    agendarReload(i);  // re-agenda com novo tempo
                }
            }
        }

        // iniciar tudo
        criarJanelas();

        // event listeners dos botões
        document.getElementById('recarregarTodasBtn').addEventListener('click', () => {
            recarregarTodasJanelas();
        });

        document.getElementById('resetTimerBtn').addEventListener('click', () => {
            resetAllTimers();
        });

        // opcional: atualiza UI periódicamente (mas não necessário)
        setInterval(() => {
            // só pra garantir que contador de reloads fique visível atualizado
            // nada mais
        }, 1000);

        // também expõe totalReloads para incremento manual (já incrementamos no reloadIframe)
        // mas a função reloadIframeByIndex já incrementa
        window.reloadIframeByIndex = reloadIframeByIndex; // debug

        // pequeno detalhe: ao criar as janelas, já exibir contagem inicial
        atualizaUI();
    })();
</script>
</body>
</html>
