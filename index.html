<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar imagens Steam</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    text-align:center;
    padding:30px;
}

input{
    width:300px;
    padding:12px;
    border:none;
    border-radius:8px;
}

button{
    padding:12px 20px;
    margin-left:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#1b2838;
    color:white;
}

#result{
    margin-top:30px;
}

img{
    width:500px;
    max-width:100%;
    border-radius:12px;
    margin:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<h1>Buscar imagens da Steam</h1>

<input type="text" id="gameName" placeholder="Ex: GTA V">
<button onclick="buscarJogo()">Buscar</button>

<div id="result"></div>

<script>
async function buscarJogo(){
    const nome = document.getElementById("gameName").value;
    const result = document.getElementById("result");

    result.innerHTML = "Buscando...";

    const searchUrl = `https://store.steampowered.com/api/storesearch/?term=${encodeURIComponent(nome)}&l=portuguese`;

    try{
        const res = await fetch(searchUrl);
        const data = await res.json();

        if(data.items.length === 0){
            result.innerHTML = "Jogo não encontrado";
            return;
        }

        const jogo = data.items[0];
        const appid = jogo.id;

        const header = `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/header.jpg`;
        const capsule = `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/library_hero.jpg`;
        const bg = `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/page_bg_generated_v6b.jpg`;

        result.innerHTML = `
            <h2>${jogo.name}</h2>
            <p>Header</p>
            <img src="${header}">
            <p>Hero Background</p>
            <img src="${capsule}">
            <p>Background</p>
            <img src="${bg}">
        `;
    }catch(err){
        result.innerHTML = "Erro ao buscar.";
        console.error(err);
    }
}
</script>

</body>
</html>
