<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Buscar imagens Steam</title>
<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:30px;
}
input{
    padding:12px;
    width:300px;
}
button{
    padding:12px;
    cursor:pointer;
}
img{
    width:500px;
    max-width:100%;
    margin:15px;
    border-radius:10px;
}
</style>
</head>
<body>

<h1>Buscar imagens da Steam</h1>

<input id="gameName" placeholder="Digite o nome do jogo">
<button onclick="buscar()">Buscar</button>

<div id="resultado"></div>

<script>
async function buscar(){
    const nome = document.getElementById("gameName").value;
    const div = document.getElementById("resultado");

    div.innerHTML = "Buscando...";

    try{
        const url = `https://corsproxy.io/?https://store.steampowered.com/api/storesearch/?term=${encodeURIComponent(nome)}&l=portuguese`;

        const res = await fetch(url);
        const data = await res.json();

        if(!data.items || data.items.length === 0){
            div.innerHTML = "Jogo não encontrado";
            return;
        }

        const jogo = data.items[0];
        const appid = jogo.id;

        div.innerHTML = `
            <h2>${jogo.name}</h2>
            <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/library_hero.jpg">
            <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/header.jpg">
            <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/page_bg_generated_v6b.jpg">
        `;
    }catch(e){
        div.innerHTML = "Erro ao buscar";
        console.error(e);
    }
}
</script>

</body>
</html>
