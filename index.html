<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar capa de jogo</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:40px;
}

input{
    width:300px;
    padding:12px;
    border:none;
    border-radius:8px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-left:10px;
}

img{
    margin-top:20px;
    width:700px;
    max-width:100%;
    border-radius:14px;
}

#resultado{
    margin-top:30px;
}
</style>
</head>
<body>

<h1>Buscar imagem automática</h1>

<input id="jogo" placeholder="Digite o nome do jogo">
<button onclick="buscar()">Buscar</button>

<div id="resultado"></div>

<script>
const API_KEY = "834abf550c2e4781a7030ce0591deedc";

async function buscar(){
    const nome = document.getElementById("jogo").value;
    const resultado = document.getElementById("resultado");

    resultado.innerHTML = "Buscando...";

    try{
        const url = `https://api.rawg.io/api/games?key=${API_KEY}&search=${encodeURIComponent(nome)}`;

        const res = await fetch(url);
        const data = await res.json();

        if(!data.results || data.results.length === 0){
            resultado.innerHTML = "Jogo não encontrado";
            return;
        }

        const jogo = data.results[0];

        resultado.innerHTML = `
            <h2>${jogo.name}</h2>
            <img src="${jogo.background_image}">
            <p><strong>URL da imagem:</strong></p>
            <textarea style="width:90%;height:80px;">${jogo.background_image}</textarea>
        `;
    }
    catch(err){
        resultado.innerHTML = "Erro ao buscar";
        console.error(err);
    }
}
</script>

</body>
</html>
